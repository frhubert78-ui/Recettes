<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recettes low carb</title>
<meta name="theme-color" content="#2f7d5b">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recettes">
<style>
:root{--bg:#faf8f4;--card:#fff;--tx:#1f2a24;--mu:#6b756e;--ac:#2f7d5b;--acx:#fff;--bd:#e3ded4;--ok:#dff0e6;--warn:#f6e3c4;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b18;--card:#222823;--tx:#eef2ee;--mu:#9aa59d;--ac:#5cc596;--acx:#0f1a14;--bd:#323a34;--ok:#243d2f;--warn:#4a3a20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171b18;--card:#222823;--tx:#eef2ee;--mu:#9aa59d;--ac:#5cc596;--acx:#0f1a14;--bd:#323a34;--ok:#243d2f;--warn:#4a3a20;color-scheme:dark}
*{box-sizing:border-box}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--veil),var(--veil)),url(bg.jpg) center/cover no-repeat;pointer-events:none}
:root{--veil:rgba(250,248,244,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--veil:rgba(23,27,24,.84)}}
:root[data-theme="dark"]{--veil:rgba(23,27,24,.84)}
:root[data-nobg] body::before{display:none}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:1.5rem;margin:8px 0 4px}h2{font-size:1.3rem;margin:4px 0 6px;line-height:1.3}h3{font-size:1rem;margin:22px 0 8px}
.sub{color:var(--mu);margin:0 0 14px}
.card{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:0 0 10px;color:var(--tx);font:inherit;cursor:pointer}
.card .ct{flex:1;min-width:0}.card b{display:block}.card span{color:var(--mu);font-size:.85rem}
.card .fav{color:#e0a100;font-size:1.1rem}
.tag{display:inline-block;background:var(--ok);border-radius:99px;padding:1px 9px;font-size:.78rem;margin-right:6px;color:var(--tx);font-style:normal}
.tag.u{background:var(--warn)}
.tag.k{background:var(--bd)}
.seg{margin:8px 0 10px}.seg button{padding:8px 4px;font-weight:600;font-size:.85rem;line-height:1.25}.seg button i{display:block;font-style:normal;font-size:1.25rem}
button{font:inherit}
button.b{background:var(--ac);color:var(--acx);border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer}
button.g{background:var(--card);color:var(--ac);border:1px solid var(--bd);border-radius:12px;padding:12px 18px;cursor:pointer}
button.x{background:transparent;color:#c0392b;border:1px solid var(--bd);border-radius:12px;padding:12px 18px;cursor:pointer}
button:disabled{opacity:.4}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{background:none;border:0;color:var(--ac);padding:8px 0;cursor:pointer}
.ico{background:none;border:0;font-size:1.5rem;padding:4px 8px;cursor:pointer;color:var(--tx);line-height:1}
.ico.on{color:#e0a100}
input[type=search],input[type=text],input[type=number],textarea,select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;font:inherit}
textarea{resize:vertical;min-height:90px}
label.f{display:block;font-weight:600;margin:14px 0 6px}
.hint{color:var(--mu);font-size:.85rem;font-weight:400}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:6px 13px;font-size:.9rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.row{display:flex;gap:10px;align-items:center}
.row select{flex:1}
.stp{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin:6px 0 0;width:max-content}
.stp button{width:40px;height:40px;border:0;border-radius:9px;background:var(--ok);color:var(--tx);font-size:1.3rem;cursor:pointer}
.stp b{min-width:120px;text-align:center}
ul.ing{list-style:none;padding:0 14px;margin:12px 0 0;background:var(--card);border:1px solid var(--bd);border-radius:14px}
ul.ing li:last-child{border-bottom:0}
ul.ing li{padding:9px 0;border-bottom:1px solid var(--bd)}
label.i{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bd);cursor:pointer}
label.i input{width:22px;height:22px;margin-top:1px;accent-color:var(--ac);flex:none}
label.i.d span{text-decoration:line-through;color:var(--mu)}
.step{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;font-size:1.25rem;line-height:1.55;min-height:170px;touch-action:pan-y}
.tm{display:inline-block;background:var(--ac);color:var(--acx);border:0;border-radius:99px;padding:2px 10px;font-size:1rem;font-weight:600;cursor:pointer;margin:0 2px}
.nav{display:flex;gap:10px;margin-top:12px}.nav button{flex:1}
.prog{height:6px;background:var(--bd);border-radius:9px;margin:10px 0}.prog i{display:block;height:100%;background:var(--ac);border-radius:9px}
.tabs{display:flex;gap:8px;margin:14px 0 4px}.tabs button{flex:1;padding:10px}
.tabs .on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.grp{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 14px 4px;margin:0 0 12px}
.grp .top b{font-size:1rem}
.grp label.i:last-child{border-bottom:0}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.small{font-size:.85rem;color:var(--mu)}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#bar button{flex:1;background:none;border:0;color:var(--mu);padding:8px 0 9px;font-size:.78rem;cursor:pointer;position:relative}
#bar button i{display:block;font-style:normal;font-size:1.35rem;line-height:1.2}
#bar button.on{color:var(--ac);font-weight:600}
#bar .bdg{position:absolute;top:3px;left:calc(50% + 8px);background:#c0392b;color:#fff;border-radius:99px;font-size:.7rem;padding:0 6px;font-weight:600}
#tb{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
#tb div{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--tx);color:var(--bg);border-radius:99px;padding:7px 8px 7px 16px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-weight:600;max-width:100%}
#tb div.ring{background:#c0392b;color:#fff}
#tb button{background:rgba(127,127,127,.3);color:inherit;border:0;border-radius:99px;padding:4px 11px;cursor:pointer;font-weight:600}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:9;font-size:.9rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.cv{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;flex:none}
.cv.il{background:radial-gradient(circle at 25% 15%,hsl(var(--h) 70% 80%),hsl(var(--h) 45% 52%))}
.cv.t{width:64px;height:64px;border-radius:12px;font-size:15px}
.cv.h{width:100%;height:200px;border-radius:18px;font-size:44px;margin:4px 0 12px}
.pl{width:3.6em;height:3.6em;border-radius:50%;background:radial-gradient(circle,#fff 58%,#efece5 59%,#fbfaf7 72%);box-shadow:0 .12em .35em rgba(0,0,0,.28);position:relative}
.pl span{position:absolute;line-height:1;filter:drop-shadow(0 .03em .05em rgba(0,0,0,.25))}
.pl span:nth-child(1){font-size:1.75em;left:10%;top:18%}
.pl span:nth-child(2){font-size:1.3em;right:6%;bottom:8%}
.cv .d{position:absolute;opacity:.28;font-size:.7em;line-height:1}
.cv .pb{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.cv .pb button{background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:99px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.flt{display:flex;gap:8px;margin:2px 0 10px}.flt select{flex:1;min-width:0;padding:9px 8px;font-size:.88rem}
#fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--ac);color:var(--acx);font-size:1.8rem;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:4}
details.nc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:14px 0 0}
details.nc summary{cursor:pointer;font-weight:600}
details.nc table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
details.nc td{padding:5px 0;border-top:1px solid var(--bd)}details.nc td:last-child{text-align:right;white-space:nowrap;padding-left:10px}
.tot{background:var(--card);border-radius:10px;padding:6px 10px}
.kpi{display:flex;gap:10px;margin:10px 0 0}.kpi div{flex:1;background:var(--ok);border-radius:12px;padding:8px 12px}.kpi b{display:block;font-size:1.25rem}.kpi span{font-size:.8rem;color:var(--mu)}
.rc{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.rc span{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px 6px 4px 12px;font-size:.88rem;display:flex;align-items:center;gap:4px}
.rc button{background:none;border:0;color:var(--mu);font-size:1rem;cursor:pointer;padding:0 4px}
.aisle{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:16px 0 4px;font-weight:600}
.card{padding:8px 12px 8px 8px}
</style>
</head>
<body><main id="app"></main>
<div id="tb"></div><button id="fab" aria-label="Ajouter une recette" hidden>＋</button>
<nav id="bar"><button data-v="" id="nR"><i>📖</i>Recettes</button><button data-v="#list" id="nL"><i>🛒</i>Courses</button><button data-v="#more" id="nM"><i>⚙️</i>Plus</button></nav>
<script>
var R=[
{t:"Omelette épinards-chèvre",a:"Plaque",m:"10 min",e:["🥚","🥬"],h:95,i:["4 œufs","150 g d’épinards frais","60 g de chèvre frais","1 c. à soupe d’huile d’olive","Sel, poivre, muscade"],s:["Fais tomber les épinards 2 min dans l’huile d’olive, puis égoutte-les bien.","Bats les œufs avec sel, poivre et une pointe de muscade.","Ajoute les épinards et le chèvre en morceaux.","Cuis à feu moyen-doux 4 à 5 min, à couvert.","Replie l’omelette et sers."]},
{t:"Poulet crémeux champignons-moutarde",a:"Cookeo",m:"20 min",e:["🍗","🍄"],h:38,i:["2 blancs de poulet (300 g)","250 g de champignons","1 échalote","10 cl de crème","1 c. à soupe de moutarde","10 cl de bouillon","Sel, poivre"],s:["Coupe le poulet en dés, émince l’échalote et les champignons.","Mode dorer : poulet 4 min, puis échalote et champignons 3 min.","Ajoute le bouillon, ferme et cuis 8 min sous pression.","Libère la vapeur et remue avec la crème et la moutarde.","Laisse réduire 2 min en mode dorer, rectifie l’assaisonnement."]},
{t:"Truite et brocolis rôtis",a:"Air fryer",m:"20 min",e:["🐟","🥦"],h:15,i:["2 pavés de truite","300 g de brocoli en bouquets","1 c. à soupe d’huile","1 citron","Ail en poudre, sel, poivre"],s:["Enrobe le brocoli d’huile, d’ail en poudre, de sel et de poivre.","Cuis 4 min à 200 °C.","Ajoute les pavés de truite, remue le brocoli.","Cuis encore 7 min.","Termine avec le jus de citron."]},
{t:"Velouté courgette-chèvre, œufs mollets",a:"Robot Moulinex",m:"35 min",e:["🥒","🥚"],h:110,i:["600 g de courgettes","1 oignon","400 ml de bouillon","80 g de chèvre frais","Basilic","2 œufs","Sel, poivre"],s:["Coupe les courgettes et l’oignon en morceaux.","Mets-les dans le bol avec le bouillon et le chèvre. Lance le programme soupe/velouté (environ 25 min).","Mixe jusqu’à obtenir une texture lisse, ajoute le basilic.","Pendant ce temps, cuis les œufs 6 min 30 dans l’eau bouillante, puis écale-les.","Sers le velouté avec un œuf mollet posé dessus."]},
{t:"Boulettes de bœuf, sauce tomate-courgettes",a:"Air fryer + plaque",m:"30 min",e:["🧆","🍅"],h:5,i:["300 g de bœuf haché 5 %","1 œuf","20 g de parmesan","Persil","1 petit oignon","200 g de passata","2 courgettes","Sel, poivre"],s:["Mélange la viande, l’œuf, le parmesan, le persil et l’oignon haché. Forme des boulettes.","Cuis-les 12 min à 180 °C à l’air fryer.","Taille les courgettes en spaghettis.","Chauffe la passata 5 min, ajoute les courgettes 3 min.","Ajoute les boulettes dans la sauce et sers."]},
{t:"Riz de chou-fleur sauté aux crevettes",a:"Robot + plaque",m:"20 min",e:["🦐","🥚"],h:25,i:["400 g de chou-fleur","250 g de crevettes décortiquées","2 œufs","2 gousses d’ail","1 c. à soupe de sauce soja","1 c. à soupe d’huile"],s:["Hache le chou-fleur par impulsions de 3 à 4 s pour obtenir une semoule.","Fais sauter les crevettes avec l’ail 3 min, puis retire-les.","Fais sauter le chou-fleur 5 min.","Pousse sur le côté et brouille les œufs.","Remets les crevettes, ajoute la sauce soja et mélange."]},
{t:"Cuisses de poulet moutarde, haricots verts",a:"Air fryer",m:"35 min",e:["🍗","🫛"],h:48,i:["4 cuisses de poulet","2 c. à soupe de moutarde","1 c. à soupe d’huile d’olive","300 g de haricots verts","Paprika, sel, poivre"],s:["Badigeonne les cuisses de moutarde, huile, paprika, sel et poivre.","Cuis 20 min à 190 °C en les retournant à mi-cuisson.","Mélange les haricots verts avec un peu d’huile, sel et poivre.","Ajoute-les dans le panier et cuis encore 8 à 10 min.","Vérifie que le poulet est bien cuit à cœur, puis sers."]},
{t:"Cabillaud en papillote, courgettes citronnées",a:"Air fryer",m:"25 min",e:["🐟","🍋"],h:195,i:["2 dos de cabillaud","2 courgettes","1 citron","1 c. à soupe d’huile d’olive","Aneth ou persil","Sel, poivre"],s:["Coupe les courgettes en rondelles fines.","Prépare 2 feuilles de papier cuisson : courgettes au centre, cabillaud dessus.","Ajoute huile, jus et zeste de citron, herbes, sel et poivre.","Ferme les papillotes et cuis 15 min à 180 °C.","Ouvre avec précaution (vapeur) et sers."]},
{t:"Curry de poulet coco-épinards",a:"Cookeo",m:"25 min",e:["🍛","🥥"],h:42,i:["300 g de blanc de poulet","200 g d’épinards frais","20 cl de lait de coco","1 oignon","1 c. à soupe de pâte de curry","1 c. à soupe d’huile","Sel"],s:["Coupe le poulet en dés et émince l’oignon.","Mode dorer : oignon et poulet 4 min avec l’huile.","Ajoute la pâte de curry, mélange 1 min.","Verse le lait de coco, ferme et cuis 7 min sous pression.","Libère la vapeur, ajoute les épinards et remue 2 min en mode dorer."]},
{t:"Gratin de chou-fleur au jambon",a:"Cookeo + air fryer",m:"30 min",e:["🧀","🍖"],h:50,i:["500 g de chou-fleur en bouquets","3 tranches de jambon","15 cl de crème","60 g d’emmental râpé","Muscade, sel, poivre"],s:["Cuis le chou-fleur 3 min sous pression dans le Cookeo avec un verre d’eau, puis égoutte.","Dispose chou-fleur et jambon coupé en lanières dans un plat.","Mélange la crème avec muscade, sel et poivre, verse sur le plat.","Parsème d’emmental.","Gratine 8 à 10 min à 190 °C à l’air fryer."]},
{t:"Salade César au poulet, sans croûtons",a:"Plaque",m:"20 min",e:["🥗","🍗"],h:85,i:["2 blancs de poulet","1 romaine","2 œufs","30 g de parmesan","3 c. à soupe de yaourt grec","1 c. à soupe de moutarde","Jus de citron, ail, huile"],s:["Cuis le poulet à la poêle 5 à 6 min de chaque côté, puis tranche-le.","Cuis les œufs 9 min, écale-les et coupe-les en quartiers.","Mélange yaourt, moutarde, jus de citron, ail râpé et un filet d’huile.","Déchire la romaine dans un saladier avec la sauce.","Ajoute poulet, œufs et copeaux de parmesan."]},
{t:"Œufs cocotte champignons-jambon",a:"Air fryer",m:"20 min",e:["🥚","🍄"],h:30,i:["4 œufs","150 g de champignons","2 tranches de jambon","4 c. à soupe de crème","Ciboulette, sel, poivre"],s:["Fais revenir les champignons émincés 4 min à la poêle.","Répartis champignons et jambon coupé dans 2 ramequins.","Ajoute 2 c. à soupe de crème, puis casse 2 œufs dans chaque ramequin.","Sale, poivre et cuis 8 à 10 min à 180 °C à l’air fryer.","Parsème de ciboulette."]},
{t:"Chili con carne sans haricots",a:"Cookeo",m:"30 min",e:["🌶️","🥑"],h:2,i:["300 g de bœuf haché 5 %","1 poivron rouge","1 petit oignon","2 gousses d’ail","200 g de tomates concassées","1 c. à café de cumin","1 c. à café de paprika fumé","1 avocat","Sel, poivre"],s:["Émince l’oignon et l’ail, coupe le poivron en dés.","Mode dorer : fais revenir la viande 4 min, puis l’oignon, l’ail et le poivron 3 min.","Ajoute les épices, les tomates concassées et un demi-verre d’eau. Ferme et cuis 10 min sous pression.","Libère la vapeur et laisse réduire 3 min en mode dorer.","Sers avec l’avocat coupé en tranches."]},
{t:"Tajine de poulet citron-olives",a:"Cookeo",m:"35 min",e:["🍋","🫒"],h:55,i:["4 hauts de cuisse de poulet (500 g)","1 oignon","1 citron confit","60 g d’olives vertes","1 c. à café de ras el hanout","15 cl de bouillon","Coriandre"],s:["Émince l’oignon, coupe le citron confit en quartiers.","Mode dorer : fais dorer le poulet 5 min, ajoute l’oignon 2 min.","Ajoute le ras el hanout, le citron confit, les olives et le bouillon.","Ferme et cuis 15 min sous pression.","Libère la vapeur, réduis la sauce 3 min en mode dorer et parsème de coriandre."]},
{t:"Aubergines farcies bœuf-feta",a:"Air fryer",m:"40 min",e:["🍆","🧀"],h:280,i:["2 petites aubergines (400 g)","200 g de bœuf haché 5 %","100 g de passata","80 g de feta","1 gousse d’ail","Menthe, sel, poivre"],s:["Coupe les aubergines en deux, quadrille la chair et badigeonne d’un peu d’huile.","Cuis-les 15 min à 190 °C, chair vers le haut.","Pendant ce temps, fais revenir la viande et l’ail 5 min, ajoute la passata 3 min.","Évide un peu les aubergines, mélange la chair à la viande et garnis-les.","Émiette la feta dessus et cuis 8 min à 190 °C. Parsème de menthe."]},
{t:"Brochettes de poulet tikka, raïta",a:"Air fryer",m:"25 min",e:["🍢","🥒"],h:22,i:["300 g de blanc de poulet","150 g de yaourt grec","1 c. à soupe d’épices tikka","150 g de concombre","1 citron","Menthe, sel"],s:["Coupe le poulet en cubes, mélange-le avec 50 g de yaourt, les épices, la moitié du jus de citron et du sel.","Enfile les cubes sur des piques (laisse mariner 15 min si tu as le temps).","Cuis 12 min à 200 °C en retournant à mi-cuisson.","Râpe le concombre, presse-le, puis mélange avec le reste du yaourt, la menthe et le jus de citron.","Sers les brochettes avec la raïta."]},
{t:"Filet mignon, poireaux à la crème",a:"Cookeo",m:"35 min",e:["🥩","🧈"],h:70,i:["1 filet mignon de porc (400 g)","1 gros poireau (200 g)","10 cl de crème","1 c. à soupe de beurre","10 cl de bouillon","Thym, sel, poivre"],s:["Coupe le filet mignon en médaillons épais et émince le poireau.","Mode dorer : fais dorer les médaillons dans le beurre 4 min, puis retire-les.","Fais revenir le poireau 3 min, ajoute le bouillon et le thym, puis remets la viande.","Ferme et cuis 8 min sous pression.","Libère la vapeur, ajoute la crème et laisse réduire 2 min en mode dorer."]},
{t:"Lasagnes de courgettes",a:"Air fryer",m:"45 min",e:["🥒","🍅"],h:12,i:["2 courgettes (400 g)","250 g de bœuf haché 5 %","150 g de passata","125 g de ricotta","1 mozzarella","Basilic, sel, poivre"],s:["Coupe les courgettes en fines lamelles dans la longueur, sale-les et laisse-les dégorger 10 min, puis sèche-les.","Fais revenir la viande 5 min, ajoute la passata et laisse mijoter 5 min.","Dans un plat qui rentre dans l’air fryer, alterne courgettes, sauce, ricotta. Termine par la mozzarella en tranches.","Cuis 20 min à 170 °C (couvre de papier alu les 10 premières minutes).","Laisse reposer 5 min et parsème de basilic."]},
{t:"Shakshuka à la feta",a:"Plaque",m:"25 min",e:["🍳","🍅"],h:8,i:["4 œufs","1 poivron rouge","1 petit oignon","2 gousses d’ail","250 g de tomates concassées","1 c. à café de cumin","1 c. à café de paprika","50 g de feta","Coriandre, sel, poivre"],s:["Fais revenir l’oignon, l’ail et le poivron émincés 5 min dans un peu d’huile.","Ajoute les épices, puis les tomates concassées. Laisse mijoter 8 min.","Creuse 4 puits et casse un œuf dans chacun.","Couvre et cuis 5 à 6 min, jusqu’à ce que les blancs soient pris.","Émiette la feta, parsème de coriandre et sers."]},
{t:"Soupe thaï coco-crevettes",a:"Robot Moulinex",m:"25 min",e:["🦐","🥥"],h:170,i:["250 g de crevettes décortiquées","20 cl de lait de coco","50 cl de bouillon","150 g de champignons","1 c. à soupe de pâte de curry","1 morceau de gingembre","1 c. à soupe de nuoc-mâm","1 citron vert","Coriandre"],s:["Mets le bouillon, le lait de coco, la pâte de curry et le gingembre râpé dans le bol.","Lance un programme mijoté à 100 °C pendant 10 min.","Ajoute les champignons émincés et cuis 5 min.","Ajoute les crevettes et cuis encore 4 min, sans mixer.","Termine avec le nuoc-mâm, le jus de citron vert et la coriandre."]},
{t:"Velouté de chou-fleur, lardons grillés",a:"Robot Moulinex",m:"35 min",e:["🥣","🥓"],h:45,i:["500 g de chou-fleur","1 petit oignon","50 cl de bouillon","10 cl de crème","100 g de lardons","Muscade, sel, poivre"],s:["Mets le chou-fleur en morceaux, l’oignon et le bouillon dans le bol.","Lance le programme soupe/velouté (environ 25 min).","Pendant ce temps, fais griller les lardons à sec 5 min à la poêle.","Ajoute la crème et la muscade, puis mixe jusqu’à obtenir un velouté lisse.","Sers avec les lardons grillés par-dessus."]},
{t:"Steak haché, purée de céleri",a:"Cookeo",m:"25 min",e:["🥩","🥣"],h:32,i:["2 steaks hachés 5 % (250 g)","1 boule de céleri-rave (400 g)","20 g de beurre","5 cl de crème","Muscade, sel, poivre"],s:["Épluche le céleri et coupe-le en cubes.","Mets-le dans le Cookeo avec un verre d’eau, ferme et cuis 10 min sous pression.","Égoutte, puis écrase ou mixe avec le beurre, la crème, la muscade, sel et poivre.","Cuis les steaks 2 à 3 min de chaque côté à la poêle.","Sers les steaks avec la purée."]},
{t:"Œufs brouillés truite fumée-avocat",a:"Plaque",m:"10 min",e:["🍳","🥑"],h:150,i:["4 œufs","100 g de truite fumée","1 avocat","1 c. à soupe de crème","10 g de beurre","Ciboulette, poivre"],s:["Bats les œufs avec la crème et du poivre.","Fais fondre le beurre à feu doux, verse les œufs.","Remue sans arrêt 3 à 4 min, retire du feu quand ils sont encore crémeux.","Coupe l’avocat en tranches et la truite fumée en lanières.","Dresse les œufs avec la truite et l’avocat, parsème de ciboulette."]},
{t:"Larb de bœuf en feuilles de laitue",a:"Plaque",m:"20 min",e:["🥬","🌶️"],h:120,i:["300 g de bœuf haché 5 %","1 échalote","1 citron vert","1 c. à soupe de nuoc-mâm","1 petit piment","150 g de concombre","1 laitue","Menthe, coriandre"],s:["Émince l’échalote et le piment, coupe le concombre en petits dés.","Fais revenir la viande 5 à 6 min à feu vif, sans matière grasse.","Hors du feu, ajoute l’échalote, le piment, le nuoc-mâm et le jus du citron vert.","Ajoute la menthe et la coriandre ciselées.","Sers dans les feuilles de laitue avec le concombre."]}

{k:"riz",t:"Riz cantonais",a:"Plaque",m:"25 min",e:["🍚","🥚"],h:45,i:["150 g de riz","2 œufs","2 tranches de jambon","100 g de petits pois","2 oignons nouveaux","2 c. à soupe de sauce soja","1 c. à soupe d’huile"],s:["Cuis le riz 10 min dans l’eau bouillante salée, égoutte-le et laisse-le refroidir (idéalement la veille).","Bats les œufs et fais une omelette fine dans un peu d’huile, puis coupe-la en lanières.","Fais revenir les oignons nouveaux émincés et les petits pois 3 min dans le reste d’huile.","Ajoute le riz et fais-le sauter 4 min à feu vif.","Ajoute le jambon en dés, l’omelette et la sauce soja, mélange 1 min et sers."]},
{k:"riz",t:"Risotto aux champignons",a:"Cookeo",m:"25 min",e:["🍚","🍄"],h:35,i:["160 g de riz arborio","250 g de champignons","1 échalote","10 cl de vin blanc","50 cl de bouillon","30 g de parmesan","20 g de beurre","Sel, poivre"],s:["Émince l’échalote et les champignons.","Mode dorer : fais revenir l’échalote et les champignons 3 min dans la moitié du beurre, ajoute le riz et nacre-le 2 min.","Verse le vin blanc et laisse évaporer 1 min, puis ajoute le bouillon.","Ferme et cuis 6 min sous pression.","Libère la vapeur, ajoute le parmesan et le reste du beurre, remue 1 min et sers aussitôt."]},
{k:"riz",t:"Poulet basquaise et riz",a:"Cookeo",m:"35 min",e:["🍗","🫑"],h:10,i:["4 hauts de cuisse de poulet (500 g)","2 poivrons","1 oignon","2 gousses d’ail","200 g de tomates concassées","1 c. à café de piment d’Espelette","150 g de riz","1 c. à soupe d’huile d’olive","Sel"],s:["Coupe les poivrons en lanières, émince l’oignon et l’ail.","Mode dorer : fais dorer le poulet 5 min dans l’huile, ajoute l’oignon, l’ail et les poivrons 3 min.","Ajoute les tomates concassées, le piment d’Espelette et un demi-verre d’eau. Ferme et cuis 12 min sous pression.","Pendant ce temps, cuis le riz 11 min dans l’eau bouillante salée.","Sers le poulet et sa sauce avec le riz."]},
{k:"riz",t:"Paëlla express poulet-chorizo-crevettes",a:"Plaque",m:"35 min",e:["🥘","🦐"],h:28,i:["150 g de riz rond","200 g de blanc de poulet","50 g de chorizo","150 g de crevettes décortiquées","1 oignon","1 poivron rouge","100 g de petits pois","50 cl de bouillon","1 c. à soupe d’huile d’olive","Safran, sel"],s:["Coupe le poulet en dés, le chorizo en rondelles, l’oignon et le poivron en morceaux.","Fais dorer le poulet et le chorizo 5 min dans l’huile, puis ajoute l’oignon et le poivron 3 min.","Ajoute le riz, mélange 1 min, puis verse le bouillon chaud et le safran.","Laisse cuire à feu moyen 15 min sans remuer.","Ajoute les crevettes et les petits pois, couvre et cuis encore 5 min. Laisse reposer 3 min avant de servir."]},
{k:"riz",t:"Riz sauté thaï au poulet-basilic",a:"Plaque",m:"20 min",e:["🍚","🌶️"],h:100,i:["150 g de riz jasmin","250 g de blanc de poulet","2 gousses d’ail","1 petit piment","1 c. à soupe de sauce huître","1 c. à soupe de sauce soja","1 c. à café de sucre","2 œufs","1 c. à soupe d’huile","Basilic thaï"],s:["Cuis le riz 10 min, égoutte-le et laisse-le tiédir.","Hache le poulet en petits morceaux, émince l’ail et le piment.","Fais sauter l’ail et le piment 1 min dans l’huile, ajoute le poulet 5 min.","Ajoute le riz, les sauces et le sucre, fais sauter 3 min, puis le basilic.","Fais cuire les œufs au plat à part et pose-les sur le riz."]},
{k:"riz",t:"Bowl de truite teriyaki",a:"Air fryer",m:"25 min",e:["🍣","🥑"],h:200,i:["150 g de riz","2 pavés de truite","3 c. à soupe de sauce soja","1 c. à soupe de miel","1 c. à café de gingembre","1 avocat","150 g de concombre","1 c. à soupe de graines de sésame"],s:["Cuis le riz 11 min dans l’eau bouillante, puis égoutte-le.","Mélange la sauce soja, le miel et le gingembre râpé. Badigeonne les pavés de truite avec la moitié.","Cuis la truite 7 min à 190 °C à l’air fryer.","Pendant ce temps, fais réduire le reste de sauce 2 min dans une petite casserole.","Dresse le riz, la truite, l’avocat et le concombre en tranches. Arrose de sauce et parsème de sésame."]},
{k:"pates",t:"Spaghetti carbonara",a:"Plaque",m:"20 min",e:["🍝","🥓"],h:48,i:["200 g de spaghetti","125 g de lardons","2 jaunes d’œufs","1 œuf","50 g de parmesan","Poivre"],s:["Cuis les spaghetti dans une grande casserole d’eau salée selon le paquet (environ 10 min).","Pendant ce temps, fais dorer les lardons 5 min à sec à la poêle.","Bats les jaunes, l’œuf entier et le parmesan râpé avec beaucoup de poivre.","Égoutte les pâtes en gardant un peu d’eau de cuisson, puis mets-les dans la poêle hors du feu.","Verse le mélange aux œufs et remue vivement en ajoutant un peu d’eau de cuisson pour obtenir une sauce crémeuse."]},
{k:"pates",t:"Penne bolognaise one pot",a:"Cookeo",m:"30 min",e:["🍝","🍅"],h:6,i:["200 g de penne","250 g de bœuf haché 15 %","1 oignon","1 carotte","1 gousse d’ail","300 g de passata","20 g de parmesan","Basilic, sel, poivre"],s:["Hache l’oignon, l’ail et la carotte.","Mode dorer : fais revenir la viande 4 min, puis les légumes 3 min.","Ajoute la passata, les penne et 40 cl d’eau. Sale et poivre.","Ferme et cuis 5 min sous pression.","Libère la vapeur, remue, puis sers avec le parmesan et le basilic."]},
{k:"pates",t:"Tagliatelles à la truite, crème citronnée",a:"Plaque",m:"20 min",e:["🍝","🐟"],h:190,i:["200 g de tagliatelles","2 pavés de truite","15 cl de crème","1 citron","1 échalote","Aneth, sel, poivre"],s:["Cuis les tagliatelles dans l’eau bouillante salée selon le paquet.","Coupe la truite en cubes et fais-la dorer 4 min à la poêle avec l’échalote émincée.","Ajoute la crème, le zeste et le jus du citron, laisse frémir 2 min.","Égoutte les pâtes et mélange-les à la sauce.","Parsème d’aneth, poivre et sers."]},
{k:"pates",t:"Gratin de coquillettes jambon-fromage",a:"Air fryer",m:"30 min",e:["🧀","🍝"],h:52,i:["200 g de coquillettes","3 tranches de jambon","20 cl de crème","80 g d’emmental râpé","Muscade, sel, poivre"],s:["Cuis les coquillettes 2 min de moins que sur le paquet, puis égoutte-les.","Mélange-les avec le jambon en dés, la crème, la muscade, sel et poivre.","Verse dans un plat qui rentre dans l’air fryer et couvre d’emmental.","Gratine 10 min à 180 °C.","Laisse reposer 2 min et sers."]},
{k:"pates",t:"Fusilli au pesto, poulet et tomates cerises",a:"Plaque",m:"20 min",e:["🌿","🍅"],h:90,i:["200 g de fusilli","250 g de blanc de poulet","3 c. à soupe de pesto","200 g de tomates cerises","20 g de parmesan","1 c. à soupe d’huile d’olive"],s:["Cuis les fusilli dans l’eau bouillante salée selon le paquet.","Coupe le poulet en lamelles et fais-le dorer 6 min dans l’huile.","Ajoute les tomates cerises coupées en deux et cuis 2 min.","Égoutte les pâtes et mélange-les avec le pesto, le poulet et les tomates.","Parsème de parmesan et sers."]},
{k:"pates",t:"One pot pasta tomate-mozzarella",a:"Cookeo",m:"20 min",e:["🍝","🧀"],h:0,i:["200 g de spaghetti","400 g de tomates concassées","1 oignon","2 gousses d’ail","50 cl de bouillon","1 mozzarella","1 c. à soupe d’huile d’olive","Basilic, sel, poivre"],s:["Émince l’oignon et l’ail.","Mode dorer : fais-les revenir 2 min dans l’huile.","Ajoute les spaghetti cassés en deux, les tomates concassées et le bouillon.","Ferme et cuis 5 min sous pression.","Libère la vapeur, ajoute la mozzarella en morceaux et le basilic, remue et sers."]},
{k:"nouilles",t:"Pad thaï aux crevettes",a:"Plaque",m:"25 min",e:["🍜","🦐"],h:30,i:["150 g de nouilles de riz","200 g de crevettes décortiquées","2 œufs","100 g de pousses de soja","2 oignons nouveaux","2 c. à soupe de nuoc-mâm","1 c. à soupe de sucre","1 citron vert","30 g de cacahuètes","1 c. à soupe d’huile"],s:["Fais tremper les nouilles 8 min dans l’eau très chaude, puis égoutte-les.","Mélange le nuoc-mâm, le sucre et le jus du citron vert.","Fais sauter les crevettes 2 min dans l’huile, pousse-les sur le côté et brouille les œufs.","Ajoute les nouilles et la sauce, fais sauter 3 min.","Ajoute les pousses de soja et les oignons nouveaux, puis parsème de cacahuètes concassées."]},
{k:"nouilles",t:"Nouilles sautées bœuf-brocoli",a:"Plaque",m:"20 min",e:["🥡","🥦"],h:20,i:["150 g de nouilles aux œufs","250 g de rumsteck de bœuf","200 g de brocoli","2 c. à soupe de sauce soja","1 c. à soupe de sauce huître","1 gousse d’ail","1 c. à café de gingembre","1 c. à soupe d’huile"],s:["Cuis les nouilles 4 min dans l’eau bouillante, puis égoutte-les.","Taille le bœuf en fines lamelles et le brocoli en petits bouquets.","Fais sauter le bœuf 2 min à feu très vif dans l’huile, puis retire-le.","Fais sauter le brocoli avec l’ail et le gingembre 4 min avec un fond d’eau.","Remets le bœuf, ajoute les nouilles et les sauces, fais sauter 2 min et sers."]},
{k:"nouilles",t:"Nouilles de riz poulet-cacahuète",a:"Plaque",m:"20 min",e:["🥜","🍜"],h:38,i:["150 g de nouilles de riz","250 g de blanc de poulet","1 carotte","1 poivron rouge","2 c. à soupe de beurre de cacahuète","2 c. à soupe de sauce soja","1 citron vert","1 c. à soupe d’huile","Coriandre"],s:["Fais tremper les nouilles 8 min dans l’eau très chaude, puis égoutte-les.","Délaye le beurre de cacahuète avec la sauce soja, le jus du citron vert et 4 c. à soupe d’eau chaude.","Fais sauter le poulet en lamelles 5 min dans l’huile.","Ajoute la carotte râpée et le poivron en lanières 3 min.","Ajoute les nouilles et la sauce, mélange 2 min et parsème de coriandre."]},
{k:"ramen",t:"Ramen shoyu au poulet",a:"Plaque",m:"30 min",e:["🍜","🥚"],h:25,i:["180 g de nouilles ramen","2 blancs de poulet","80 cl de bouillon","3 c. à soupe de sauce soja","1 c. à soupe de mirin","2 œufs","2 oignons nouveaux","1 morceau de gingembre","1 gousse d’ail","1 pak choï"],s:["Fais frémir le bouillon avec la sauce soja, le mirin, le gingembre et l’ail tranchés. Ajoute les blancs de poulet et poche-les 12 min.","Cuis les œufs 6 min 30 dans l’eau bouillante, plonge-les dans l’eau froide et écale-les.","Retire le poulet et tranche-le. Ajoute le pak choï coupé en quatre dans le bouillon pendant 2 min.","Cuis les nouilles selon le paquet (environ 3 min) et égoutte-les.","Répartis nouilles et bouillon dans 2 bols, ajoute le poulet, le pak choï, l’œuf coupé en deux et les oignons nouveaux."]},
{k:"ramen",t:"Ramen miso au porc",a:"Cookeo",m:"35 min",e:["🍜","🐖"],h:340,i:["180 g de nouilles ramen","300 g d’échine de porc","2 c. à soupe de pâte miso","80 cl de bouillon","100 g de maïs","2 œufs","2 oignons nouveaux","1 gousse d’ail","1 c. à soupe d’huile de sésame"],s:["Coupe le porc en tranches fines.","Mode dorer : fais dorer le porc et l’ail 4 min dans l’huile de sésame.","Ajoute le bouillon, ferme et cuis 10 min sous pression.","Pendant ce temps, cuis les œufs 6 min 30, rafraîchis-les et écale-les. Cuis les nouilles selon le paquet.","Libère la vapeur, délaye le miso dans le bouillon (sans faire bouillir). Sers sur les nouilles avec le maïs, l’œuf et les oignons nouveaux."]},
{k:"ramen",t:"Ramen épicé aux crevettes",a:"Plaque",m:"25 min",e:["🍜","🌶️"],h:8,i:["180 g de nouilles ramen","200 g de crevettes décortiquées","80 cl de bouillon","2 c. à soupe de sauce soja","1 c. à soupe de sriracha","150 g de champignons","1 pak choï","2 œufs","2 oignons nouveaux"],s:["Cuis les œufs 6 min 30, rafraîchis-les et écale-les.","Fais chauffer le bouillon avec la sauce soja et la sriracha.","Ajoute les champignons émincés et le pak choï, cuis 4 min.","Ajoute les crevettes et cuis 3 min. Cuis les nouilles à part selon le paquet.","Sers les nouilles dans le bouillon avec les crevettes, les légumes, l’œuf et les oignons nouveaux."]},
{k:"burger",t:"Cheeseburger maison",a:"Air fryer",m:"20 min",e:["🍔","🧀"],h:30,i:["2 pains à burger","2 steaks hachés 15 % (300 g)","2 tranches de cheddar","1 tomate","4 feuilles de salade","1 petit oignon","2 cornichons","2 c. à soupe de ketchup","1 c. à soupe de moutarde","Sel, poivre"],s:["Sale et poivre les steaks, cuis-les 8 min à 200 °C à l’air fryer en les retournant à mi-cuisson.","Pose une tranche de cheddar sur chaque steak et laisse fondre 1 min.","Toaste les pains 2 min à l’air fryer.","Coupe la tomate, l’oignon et les cornichons en rondelles.","Monte les burgers : pain, ketchup et moutarde, salade, steak au cheddar, tomate, oignon, cornichons."]},
{k:"burger",t:"Burger de poulet croustillant",a:"Air fryer",m:"30 min",e:["🍔","🍗"],h:40,i:["2 pains à burger","2 blancs de poulet (300 g)","40 g de chapelure","1 œuf","1 c. à café de paprika","2 c. à soupe de mayonnaise","4 feuilles de salade","1 tomate","Sel, poivre"],s:["Aplatis les blancs de poulet pour qu’ils aient la même épaisseur.","Trempe-les dans l’œuf battu, puis dans la chapelure mélangée au paprika, sel et poivre.","Cuis 12 min à 190 °C à l’air fryer en les retournant à mi-cuisson.","Toaste les pains 2 min.","Monte les burgers avec la mayonnaise, la salade, le poulet et la tomate."]},
{k:"burger",t:"Burger végétarien aux pois chiches",a:"Air fryer",m:"30 min",e:["🍔","🥑"],h:110,i:["2 pains à burger","250 g de pois chiches cuits","1 petit oignon","1 gousse d’ail","30 g de chapelure","1 c. à café de cumin","1 avocat","1 tomate","2 c. à soupe de yaourt grec","4 feuilles de salade","Sel, poivre"],s:["Mixe les pois chiches égouttés avec l’oignon, l’ail, le cumin, sel et poivre par impulsions.","Ajoute la chapelure et forme 2 galettes épaisses.","Badigeonne-les d’un peu d’huile et cuis 12 min à 190 °C en les retournant à mi-cuisson.","Écrase l’avocat avec le yaourt, sel et poivre. Toaste les pains 2 min.","Monte les burgers avec la crème d’avocat, la salade, la galette et la tomate."]},
{k:"puree",t:"Purée maison et saucisses",a:"Cookeo",m:"30 min",e:["🥔","🌭"],h:42,i:["800 g de pommes de terre","15 cl de lait","40 g de beurre","4 saucisses de Toulouse","Muscade, sel, poivre"],s:["Épluche les pommes de terre et coupe-les en gros morceaux.","Mets-les dans le Cookeo avec 2 verres d’eau salée, ferme et cuis 10 min sous pression.","Pendant ce temps, cuis les saucisses 15 min à la poêle à feu moyen en les retournant.","Égoutte les pommes de terre et écrase-les avec le lait chaud et le beurre.","Assaisonne avec muscade, sel et poivre, puis sers avec les saucisses."]},
{k:"puree",t:"Hachis parmentier",a:"Cookeo + air fryer",m:"45 min",e:["🥔","🥩"],h:24,i:["700 g de pommes de terre","300 g de bœuf haché 15 %","1 oignon","15 cl de lait","30 g de beurre","50 g d’emmental râpé","Muscade, sel, poivre"],s:["Cuis les pommes de terre épluchées 10 min sous pression dans le Cookeo avec 2 verres d’eau salée.","Égoutte et écrase-les avec le lait chaud, le beurre et la muscade.","Fais revenir l’oignon haché et la viande 6 min à la poêle, sale et poivre.","Dans un plat qui rentre dans l’air fryer, étale la viande, puis la purée, et parsème d’emmental.","Gratine 12 min à 180 °C."]},

function scaleIng(s,f){if(f==1)return s;var m=s.match(/^(\d+(?:[.,]\d+)?)(.*)$/),out=s;
if(m){var q0=parseFloat(m[1].replace(",",".")),q=q0*f,tail=m[2],um=tail.match(/^\s*(kg|g|ml|cl|l)(?![A-Za-z0-9])/);
if(!um&&/œuf/.test(tail))q=Math.max(1,Math.round(q));
if(!um){var r1=Math.round(q*2)/2;if(r1>1&&q0<=1)tail=plurSeg(tail,true);else if(r1<=1&&q0>1)tail=plurSeg(tail,false)}
out=fmt(q,um?um[1]:"")+tail}
return out.replace(/\((\d+(?:[.,]\d+)?)(\s*)(kg|g|ml|cl|l)\)/g,function(_,num,sp,u){return"("+fmt(parseFloat(num.replace(",","."))*f,u)+sp+u+")"})}

/* ---------- Minuteurs ---------- */
function timers(s){return s.replace(/(\d+)(?:\s*à\s*(\d+))?\s*min(?:utes?)?(?![a-z])(?:\s*(\d+)(?![\d°]))?/g,function(m,a,b,sec){var t=(+a)*60+(sec?+sec:0);return'<button class="tm" data-s="'+t+'" data-l="'+m+'">⏱ '+m+"</button>"})}
var T=[],ti=null,ac=null,tb=document.getElementById("tb");
tb.onclick=function(e){var b=e.target.closest("button");if(!b)return;T=T.filter(function(t){return String(t.id)!=b.dataset.id});tick()};
function startT(sec,label){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
T.push({id:String(Date.now()),l:label,end:Date.now()+sec*1000});toast("Minuteur lancé : "+label.split(" · ")[1]);tick()}
function beep(){try{var t=ac.currentTime;for(var k=0;k<3;k++){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.0001,t+k*.5);g.gain.exponentialRampToValueAtTime(.4,t+k*.5+.02);g.gain.exponentialRampToValueAtTime(.0001,t+k*.5+.35);o.start(t+k*.5);o.stop(t+k*.5+.4)}}catch(e){}}
function tick(){var now=Date.now(),h="";
T.forEach(function(t){var left=Math.max(0,Math.round((t.end-now)/1000));
if(!left&&!t.rung){t.rung=1;t.ring=now}
if(t.rung&&now-t.ring<60000&&(now-t.ring)%4000<1100){beep();if(navigator.vibrate)navigator.vibrate([300,150,300])}
h+='<div class="'+(t.rung?"ring":"")+'"><span>'+(t.rung?"⏰ "+esc(t.l)+" — terminé":esc(t.l.split(" · ")[0])+" · "+Math.floor(left/60)+":"+("0"+left%60).slice(-2))+'</span><button data-id="'+t.id+'">'+(t.rung?"OK":"✕")+"</button></div>"});
if(tb.innerHTML!==h)tb.innerHTML=h;
if(T.length&&!ti)ti=setInterval(tick,1000);if(!T.length&&ti){clearInterval(ti);ti=null}}

st.L.forEach(function(L){var r=byId(L.id);if(!r)return;var f=(L.p||2)/2;
r.i.forEach(function(x){var o=parse(x),uk=unitKey(o.u),q=o.q*f,pg=o.pg*f;
if(uk=="kg"){uk="g";q*=1000}if(uk=="l"){uk="ml";q*=1000}if(uk=="cl"){uk="ml";q*=10}
var key=norm(o.name).split(/\s+/).map(function(w){return w.replace(/[sx]$/,"")}).join(" ")+"|"+(o.q?uk:"-");
if(!M[key]){M[key]={k:key,q:0,pg:0,u:uk,ou:o.u,name:o.name,has:!!o.q,ais:o.e?o.e[3]:"Z",from:[]};order.push(key)}
var it=M[key];it.q+=q;it.pg+=pg;if(it.from.indexOf(r.t)<0)it.from.push(r.t)})});
return order.map(function(k){var it=M[k],t;
if(!it.has)t=it.name;
else{var u=it.u,uq=/oeuf/.test(k)&&!u?Math.max(1,Math.round(it.q)):it.q,lab="";
if(u=="g"){if(uq>=1000){lab="kg";uq/=1000}else lab="g"}
else if(u=="ml"){if(uq>=1000){lab="l";uq/=1000}else{lab="cl";uq/=10}}
else if(u)lab=it.ou.replace(/s$/,"")+(uq>1&&/^(gousse|tranche|pincée|morceau|boule|feuille|brin)$/.test(it.ou.replace(/s$/,""))?(/eau$/.test(it.ou.replace(/s$/,""))?"x":"s"):"");
var qs=lab=="kg"||lab=="l"||lab=="cl"?fmt(uq,lab):fmt(uq,lab||"");
t=qs+" "+(lab?lab+" "+deOf(it.name):plurSeg(it.name,Math.round(uq*2)/2>1))+(it.pg?" ("+Math.round(it.pg/5)*5+" g)":"")}
return{k:k,t:t,ais:it.ais,from:it.from}})}

/* ---------- Réglages & sauvegarde ---------- */
function more(){var h='<h1>Réglages</h1>';
h+='<label class="f">Thème</label><select id="th"><option value="">Automatique</option><option value="light">Clair</option><option value="dark">Sombre</option></select>';

h+='<div class="nav"><button class="g" id="ex">Exporter</button><button class="g" id="im">Importer</button></div><input type="file" id="fi" accept=".json,application/json" hidden>';

app.innerHTML=h;

var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove()};

fi.onchange=function(){var f=fi.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);if(typeof o!="object"||!o)throw 0;

st=ns||{};fix();save();theme();Object.keys(P).forEach(function(k){if(!ph[k])putPhoto(k,null)});Object.keys(ph).forEach(function(k){putPhoto(k,ph[k])});
toast("Sauvegarde importée");render()}catch(e){toast("Fichier invalide")}};rd.readAsText(f)}}

history.replaceState({d:0},"",location.pathname+location.search);render();
loadPhotos().then(function(){if(Object.keys(P).length)render()});
